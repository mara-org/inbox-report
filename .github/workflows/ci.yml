name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit checks
        run: python -m unittest discover -s tests -v

      - name: Compile CLI
        run: python -B -m py_compile inbox_application_reporter.py

      - name: Check CLI help and version
        run: |
          python inbox_application_reporter.py --help
          python inbox_application_reporter.py --version
