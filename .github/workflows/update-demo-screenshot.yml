name: Update Demo Screenshot

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/assets/demo-report.png

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate demo screenshot
        run: bash scripts/generate_demo_screenshot.sh

      - name: Commit screenshot if changed
        run: |
          if git diff --quiet -- docs/assets/demo-report.png; then
            echo "demo screenshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/demo-report.png
          git commit -m "Regenerate demo screenshot"
          git push
